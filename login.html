<!DOCTYPE html>
<html>

<head>

    <title>Student Login - FJMC Academy</title>

    <link rel="stylesheet" href="student.css">

</head>

<body>

<div class="login-box">

    <h1>FJMC Academy</h1>

    <h2>Student Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <p id="loginMessage"></p>

</div>


<script type="module" src="student.js"></script>

</body>

</html>
